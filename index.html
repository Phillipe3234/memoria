<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Memória do Amor - Jogo Romântico</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #2e1a47 0%, #3a235a 100%);
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, 'Roboto', sans-serif;
            padding: 20px;
            animation: fadeInPage 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        @keyframes fadeInPage {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Container principal */
        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        /* ===== PÁGINA INICIAL ===== */
        .start-screen {
            text-align: center;
            padding: 20px 10px 40px;
        }

        .floating-sunflower {
            font-size: 70px;
            display: inline-block;
            animation: floatFlower 3s ease-in-out infinite;
            filter: drop-shadow(0 8px 20px rgba(249, 231, 159, 0.4));
        }

        @keyframes floatFlower {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        h1 {
            font-size: 2.6rem;
            margin: 15px 0 30px;
            background: linear-gradient(135deg, #f9e79f, #d4ac0d);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
            letter-spacing: 2px;
        }

        .btn-primary {
            background: linear-gradient(95deg, #9b59b6, #6b3e8a);
            border: none;
            padding: 16px 32px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #f9e79f;
            border-radius: 60px;
            margin: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 0 #3a1c4a;
            width: 260px;
            font-family: inherit;
        }

        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #3a1c4a;
        }

        .btn-secondary {
            background: rgba(107, 62, 138, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid #f9e79f;
            padding: 12px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #f9e79f;
            border-radius: 60px;
            margin: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeModal 0.2s ease;
        }
        .modal-content {
            background: #2e1a47;
            max-width: 300px;
            width: 80%;
            padding: 28px 20px;
            border-radius: 48px;
            border: 2px solid #f9e79f;
            color: #f9e79f;
            text-align: center;
            position: relative;
        }
        .close-modal {
            position: absolute;
            top: 12px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            font-weight: bold;
        }
        /* Game header */
        .game-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            background: rgba(46, 26, 71, 0.75);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 80px;
            margin-bottom: 20px;
            gap: 12px;
            font-weight: bold;
            color: #f9e79f;
            border: 1px solid #9b59b6;
        }
        .stat {
            background: #2e1a47;
            padding: 6px 14px;
            border-radius: 40px;
            display: flex;
            gap: 6px;
            align-items: center;
            font-size: 0.9rem;
        }

        /* área de pares acertados (voam para cá) */
        .matched-gallery {
            background: rgba(249, 231, 159, 0.15);
            border-radius: 60px;
            min-height: 85px;
            margin-bottom: 22px;
            padding: 12px 16px;
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 12px;
            align-items: center;
            border: 1px dashed #f9e79f;
            transition: all 0.2s;
        }
        .matched-thumb {
            width: 65px;
            height: 65px;
            background: #6b3e8a;
            border-radius: 20px;
            object-fit: cover;
            border: 2px solid #f9e79f;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            animation: thumbPop 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
        }
        @keyframes thumbPop {
            from { transform: scale(0.2) rotate(-10deg); opacity: 0; }
            to { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* Grid do jogo */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            justify-items: center;
            align-items: center;
            margin: 20px 0;
        }
        .card {
            aspect-ratio: 3 / 4;
            width: 100%;
            max-width: 100px;
            background: linear-gradient(145deg, #f9e79f, #f1c40f);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
            transition: 0.2s;
            transform-style: preserve-3d;
            transition: transform 0.5s;
            transform: rotateY(0deg);
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
        }
        .card.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        .card-front {
            background: #f9e79f;
            transform: rotateY(180deg);
            overflow: hidden;
        }
        .card-front img {
            width: 85%;
            height: 85%;
            object-fit: cover;
            border-radius: 16px;
        }
        .card-back {
            background: radial-gradient(circle at 30% 20%, #9b59b6, #4a266a);
            transform: rotateY(0deg);
            font-size: 3rem;
            color: #f9e79f;
        }
        .card.vibrate {
            animation: shake 0.3s ease-in-out 0s 2;
        }
        @keyframes shake {
            0%,100%{ transform: translateX(0) rotateY(0deg); }
            25%{ transform: translateX(-4px) rotateY(10deg); }
            75%{ transform: translateX(4px) rotateY(-10deg); }
        }
        .disabled-card {
            pointer-events: none;
            opacity: 0.6;
        }

        /* animação voando */
        .flying-img {
            position: fixed;
            width: 65px;
            height: 65px;
            border-radius: 20px;
            object-fit: cover;
            z-index: 2000;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border: 2px solid gold;
        }

        .victory-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(46,26,71,0.9);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1500;
            flex-direction: column;
            animation: fadeInPage 0.5s;
        }
        .victory-card {
            background: #2e1a47;
            border-radius: 60px;
            padding: 30px;
            text-align: center;
            border: 2px solid #f9e79f;
            color: #f9e79f;
        }

        .sunflower-rain {
            position: fixed;
            pointer-events: none;
            font-size: 40px;
            animation: riseUp 2s forwards;
            z-index: 1600;
        }
        @keyframes riseUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        button {
            background: #9b59b6;
            border: none;
            font-family: inherit;
            color: #f9e79f;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 40px;
            margin-top: 15px;
            cursor: pointer;
        }

        @media (max-width: 500px) {
            .game-grid { gap: 8px; }
            .matched-thumb { width: 55px; height: 55px; }
            .stat { font-size: 0.7rem; padding: 4px 10px; }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- TELA INICIAL -->
    <div id="startScreen" class="start-screen">
        <div class="floating-sunflower">🌻💜</div>
        <h1>Memória do Amor</h1>
        <button class="btn-primary" id="btnJogar">JOGAR AGORA</button><br>
        <button class="btn-secondary" id="btnComoJogar">COMO JOGAR</button>
    </div>

    <!-- MODAL -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeModalBtn">&times;</span>
            <h3>✨ COMO JOGAR ✨</h3>
            <p style="margin-top: 15px;">💜 Encontre os pares de imagens.<br>
            🌻 Quando acertar um par, as imagens voam para o topo!<br>
            ⭐ Complete todos os pares para vencer.<br>
            🏆 Vitórias consecutivas aumentam a dificuldade.<br>
            🌞 Boa sorte, apaixonado(a)!</p>
        </div>
    </div>

    <!-- TELA DO JOGO (inicialmente oculta) -->
    <div id="gameScreen" style="display: none;">
        <div class="game-header">
            <div class="stat">🌻 RODADA <span id="roundNum">1</span></div>
            <div class="stat">⭐ <span id="matchedCount">0</span> / <span id="totalPairs">3</span></div>
            <div class="stat">⏱️ <span id="timerSec">0</span> s</div>
            <div class="stat">🏆 REC: <span id="streakRecord">0</span></div>
        </div>
        <div class="matched-gallery" id="matchedGallery"></div>
        <div class="game-grid" id="gameGrid"></div>
        <div style="display: flex; justify-content: center; margin-top: 10px;">
            <button id="menuBtnFromGame" class="btn-secondary" style="background:#2e1a47;">MENU PRINCIPAL</button>
        </div>
    </div>
</div>

<script>
    // ---------- CONFIG IMAGENS (10 placeholders prontos para substituição) ----------
    const ALL_IMAGES = [
        "imagens/i1.png",  // foto 1
        "imagens/i2.png",  // foto 2
        "imagens/i3.png",  // foto 3
        "imagens/i4.png",  // foto 4
        "imagens/i5.png",  // foto 5
        "imagens/i6.png",  // foto 6
        "imagens/i7.png",  // foto 7
        "imagens/i8.png",  // foto 8
        "imagens/i9.png",  // foto 9
        "imagens/i10.png"   // foto 10
    ];

    // Dificuldade progressiva: pares por rodada (e confusão: usa mais imagens acima do necessário)
    const ROUND_CONFIG = [
        { pairs: 3, difficulty: "easy" },     // r0
        { pairs: 4, difficulty: "easy" },
        { pairs: 5, difficulty: "medium" },
        { pairs: 6, difficulty: "confuse" },
        { pairs: 7, difficulty: "confuse" },
        { pairs: 8, difficulty: "confuse" },
        { pairs: 9, difficulty: "confuse" },
        { pairs: 10, difficulty: "max" },
        { pairs: 10, difficulty: "max" },
        { pairs: 10, difficulty: "max" }
    ];

    // Estado global
    let currentRound = 0;               // 0-index (rodada 1 = currentRound=0)
    let consecutiveWins = 0;            // vitórias seguidas
    let recordStreak = 0;               // recorde na sessão
    let cardsData = [];                 // array de objetos { id, imageUrl, flipped, matched, element, pairId }
    let lockBoard = false;
    let firstCard = null, secondCard = null;
    let timerInterval = null;
    let secondsElapsed = 0;
    let gameActive = true;              // jogo não finalizado
    let currentTotalPairs = 3;
    let matchedPairsCount = 0;
    let roundVictory = false;

    // Elementos DOM
    const startScreenDiv = document.getElementById('startScreen');
    const gameScreenDiv = document.getElementById('gameScreen');
    const gameGrid = document.getElementById('gameGrid');
    const matchedGallery = document.getElementById('matchedGallery');
    const roundNumSpan = document.getElementById('roundNum');
    const matchedCountSpan = document.getElementById('matchedCount');
    const totalPairsSpan = document.getElementById('totalPairs');
    const timerSecSpan = document.getElementById('timerSec');
    const streakRecordSpan = document.getElementById('streakRecord');
    const modal = document.getElementById('modal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const btnComoJogar = document.getElementById('btnComoJogar');
    const btnJogar = document.getElementById('btnJogar');
    const menuBtnFromGame = document.getElementById('menuBtnFromGame');

    // helpers
    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function startTimer() {
        if (timerInterval) stopTimer();
        timerInterval = setInterval(() => {
            if (!gameActive || roundVictory) return;
            secondsElapsed++;
            timerSecSpan.innerText = secondsElapsed;
        }, 1000);
    }

    function updateStatsUI() {
        matchedCountSpan.innerText = matchedPairsCount;
        totalPairsSpan.innerText = currentTotalPairs;
        roundNumSpan.innerText = currentRound + 1;
        streakRecordSpan.innerText = recordStreak;
    }

    // Embaralhamento
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Gerar cartas com base na rodada (usando ALL_IMAGES)
    function generateCardsForRound(pairsCount, roundIdx) {
        // para confusão: seleciona imagens distintas de um pool maior (mínimo 10)
        let pool = [...ALL_IMAGES];
        // Se precisar de mais variedade e for "confuse" ou max, usar todas as 10 e repetir algumas com moderação
        let neededImages = pairsCount;
        let selectedImages = [];
        for (let i = 0; i < neededImages; i++) {
            selectedImages.push(pool[i % pool.length]);
        }
        // Caso confuse: simplesmente mantém a mesma lógica (já garante que pode repetir imagens, mas cada par é igual)
        // Construir pares
        let pairList = [];
        for (let i = 0; i < pairsCount; i++) {
            pairList.push({ pairId: i, img: selectedImages[i] });
        }
        let deck = [];
        pairList.forEach(pair => {
            deck.push({ id: Math.random(), pairId: pair.pairId, imageUrl: pair.img, flipped: false, matched: false, element: null });
            deck.push({ id: Math.random(), pairId: pair.pairId, imageUrl: pair.img, flipped: false, matched: false, element: null });
        });
        return shuffleArray(deck);
    }

    // Animação de voo: clona imagem da carta e anima até galeria
    function flyToGallery(imageUrl, cardElement) {
        return new Promise((resolve) => {
            const rect = cardElement.getBoundingClientRect();
            const flyer = document.createElement('img');
            flyer.src = imageUrl;
            flyer.className = 'flying-img';
            flyer.style.width = `${rect.width}px`;
            flyer.style.height = `${rect.height}px`;
            flyer.style.left = `${rect.left}px`;
            flyer.style.top = `${rect.top}px`;
            flyer.style.position = 'fixed';
            document.body.appendChild(flyer);
            // destino: última posição da galeria
            const gallery = document.getElementById('matchedGallery');
            const targetRect = gallery.getBoundingClientRect();
            const destX = targetRect.right - 60;
            const destY = targetRect.top + 10;
            requestAnimationFrame(() => {
                flyer.style.transition = 'all 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.2)';
                flyer.style.left = `${destX}px`;
                flyer.style.top = `${destY}px`;
                flyer.style.width = '60px';
                flyer.style.height = '60px';
                flyer.style.transform = 'rotate(5deg)';
                flyer.addEventListener('transitionend', () => {
                    flyer.remove();
                    resolve();
                }, { once: true });
            });
        });
    }

    async function addMatchedThumb(imageUrl) {
        const thumb = document.createElement('img');
        thumb.src = imageUrl;
        thumb.className = 'matched-thumb';
        matchedGallery.appendChild(thumb);
        matchedGallery.scrollLeft = matchedGallery.scrollWidth;
    }

    // limpar galeria ao começar rodada
    function clearMatchedGallery() {
        matchedGallery.innerHTML = '';
    }

    async function handleMatch(cardA, cardB) {
        const imgUrl = cardA.imageUrl;
        // Desabilitar cartas para evitar clique duplicado
        cardA.matched = true;
        cardB.matched = true;
        // remover evento? apenas desabilitar visualmente
        if (cardA.element) cardA.element.classList.add('disabled-card');
        if (cardB.element) cardB.element.classList.add('disabled-card');
        // animação voando em cada carta (ordem)
        await flyToGallery(imgUrl, cardA.element);
        await flyToGallery(imgUrl, cardB.element);
        await addMatchedThumb(imgUrl);
        matchedPairsCount++;
        updateStatsUI();

        // verificar vitória
        if (matchedPairsCount === currentTotalPairs) {
            gameActive = false;
            roundVictory = true;
            stopTimer();
            showVictoryScreen();
        }
    }

    function handleMismatch(cardA, cardB) {
        // vibrar e virar
        if (cardA.element) cardA.element.classList.add('vibrate');
        if (cardB.element) cardB.element.classList.add('vibrate');
        setTimeout(() => {
            if (cardA.element && !cardA.matched) {
                cardA.element.classList.remove('flipped');
                cardA.flipped = false;
            }
            if (cardB.element && !cardB.matched) {
                cardB.element.classList.remove('flipped');
                cardB.flipped = false;
            }
            if (cardA.element) cardA.element.classList.remove('vibrate');
            if (cardB.element) cardB.element.classList.remove('vibrate');
            unlockBoard();
        }, 800);
    }

    function unlockBoard() {
        lockBoard = false;
        firstCard = secondCard = null;
    }

    function onCardClick(index) {
        if (lockBoard || !gameActive || roundVictory) return;
        const card = cardsData[index];
        if (card.matched || card.flipped) return;
        // virar carta
        card.flipped = true;
        card.element.classList.add('flipped');
        if (firstCard === null) {
            firstCard = card;
            return;
        }
        if (secondCard === null && firstCard !== card) {
            secondCard = card;
            lockBoard = true;
            // verificar par
            if (firstCard.pairId === secondCard.pairId) {
                // ACERTOU
                handleMatch(firstCard, secondCard).then(() => {
                    firstCard = null;
                    secondCard = null;
                    lockBoard = false;
                }).catch(()=>{});
            } else {
                handleMismatch(firstCard, secondCard);
                firstCard = null;
                secondCard = null;
            }
        }
    }

    function renderGame(pairsCount, roundIndex) {
        gameGrid.innerHTML = '';
        clearMatchedGallery();
        const deck = generateCardsForRound(pairsCount, roundIndex);
        cardsData = deck;
        matchedPairsCount = 0;
        gameActive = true;
        roundVictory = false;
        secondsElapsed = 0;
        timerSecSpan.innerText = "0";
        stopTimer();
        startTimer();
        currentTotalPairs = pairsCount;
        updateStatsUI();

        deck.forEach((card, idx) => {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card';
            const frontDiv = document.createElement('div');
            frontDiv.className = 'card-face card-front';
            const img = document.createElement('img');
            img.src = card.imageUrl;
            img.alt = 'amor';
            frontDiv.appendChild(img);
            const backDiv = document.createElement('div');
            backDiv.className = 'card-face card-back';
            backDiv.innerHTML = '🌻';
            cardDiv.appendChild(frontDiv);
            cardDiv.appendChild(backDiv);
            cardDiv.addEventListener('click', (e) => {
                e.stopPropagation();
                onCardClick(idx);
            });
            gameGrid.appendChild(cardDiv);
            card.element = cardDiv;
            card.flipped = false;
            card.matched = false;
        });
    }

    // vitória
    function showVictoryScreen() {
        const victoryDiv = document.createElement('div');
        victoryDiv.className = 'victory-overlay';
        victoryDiv.innerHTML = `
            <div class="victory-card">
                <h2>✨ VITÓRIA! ✨</h2>
                <p>🌻 Tempo: ${secondsElapsed} segundos 🌻</p>
                <p>🏆 Vitórias consecutivas: ${consecutiveWins + 1}</p>
                <button id="nextRoundBtn">PRÓXIMA RODADA ➕</button>
                <button id="menuVictoryBtn">MENU PRINCIPAL</button>
            </div>
        `;
        document.body.appendChild(victoryDiv);
        // Efeito girassóis subindo relacionados a vitórias consecutivas
        let flowerCount = Math.min(15 + (consecutiveWins * 2), 40);
        for (let i = 0; i < flowerCount; i++) {
            setTimeout(() => {
                const flower = document.createElement('div');
                flower.className = 'sunflower-rain';
                flower.innerHTML = ['🌻','💜','🌻','⭐'][Math.floor(Math.random()*4)];
                flower.style.left = Math.random() * 90 + '%';
                flower.style.fontSize = (25 + Math.random() * 35) + 'px';
                flower.style.animationDuration = 1.5 + Math.random() * 1.5 + 's';
                document.body.appendChild(flower);
                setTimeout(() => flower.remove(), 2000);
            }, i * 60);
        }
        // atualizar consecutivas e recorde
        consecutiveWins++;
        if (consecutiveWins > recordStreak) {
            recordStreak = consecutiveWins;
            streakRecordSpan.innerText = recordStreak;
        }
        function cleanupAndNext(next = true) {
            victoryDiv.remove();
            if (next) {
                nextRound();
            } else {
                backToMenu();
            }
        }
        document.getElementById('nextRoundBtn').onclick = () => cleanupAndNext(true);
        document.getElementById('menuVictoryBtn').onclick = () => cleanupAndNext(false);
    }

    function nextRound() {
        stopTimer();
        let nextRoundIndex = currentRound + 1;
        if (nextRoundIndex >= ROUND_CONFIG.length) {
            nextRoundIndex = ROUND_CONFIG.length - 1; // mantém máximo
        }
        currentRound = nextRoundIndex;
        const cfg = ROUND_CONFIG[currentRound];
        const pairs = cfg.pairs;
        renderGame(pairs, currentRound);
    }

    function startNewGame() {
        stopTimer();
        consecutiveWins = 0;
        currentRound = 0;
        recordStreak = Math.max(recordStreak, 0);
        streakRecordSpan.innerText = recordStreak;
        const initialPairs = ROUND_CONFIG[0].pairs;
        renderGame(initialPairs, 0);
        startScreenDiv.style.display = 'none';
        gameScreenDiv.style.display = 'block';
    }

    function backToMenu() {
        stopTimer();
        gameActive = false;
        startScreenDiv.style.display = 'flex';
        startScreenDiv.style.display = '';
        gameScreenDiv.style.display = 'none';
        if (timerInterval) clearInterval(timerInterval);
        consecutiveWins = 0;
        currentRound = 0;
    }

    // Eventos
    btnJogar.onclick = () => { startNewGame(); };
    menuBtnFromGame.onclick = () => { backToMenu(); };
    btnComoJogar.onclick = () => { modal.style.display = 'flex'; };
    closeModalBtn.onclick = () => { modal.style.display = 'none'; };
    window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };

    // pré carregar recorde
    streakRecordSpan.innerText = "0";
</script>
</body>
</html>
